.live-activity-list{max-height:300px;overflow:auto;padding:8px}.live-item{display:flex;gap:10px;padding:10px;border-radius:13px;align-items:flex-start;animation:liveItem .42s ease both}.live-item:hover{background:#fff7f1}.live-icon{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;background:#fff0e8;color:#c94e0d;font-size:16px}.live-item strong{display:block;font-size:12px;line-height:1.35}.live-item span{display:block;color:#756a63;font-size:10px;margin-top:3px;line-height:1.4}.live-new{position:relative}.live-new::after{content:"NOUVEAU";position:absolute;right:7px;top:7px;font-size:8px;font-weight:900;letter-spacing:.04em;color:#c94e0d;background:#fff0e8;border-radius:999px;padding:3px 5px}

<body>
<div id="root"></div>
<script>
const $=s=>document.querySelector(s), root=$('#root');
const state={token:localStorage.getItem('enspy_admin_token')||'',user:JSON.parse(localStorage.getItem('enspy_admin_user')||'null'),page:'dashboard',levelId:1,yearId:null,semesterId:null,levels:[],years:[],semesters:[],ues:[]};
async function api(path,opt={}){const h=opt.headers||{};h['Accept']='application/json';if(state.token)h.Authorization='Bearer '+state.token;if(opt.body&&!(opt.body instanceof FormData))h['Content-Type']='application/json';const r=await fetch('/api'+path,{...opt,headers:h});const t=await r.text();let d;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw new Error(d?.error||`Erreur ${r.status}`);return d}
function toast(msg){const x=document.createElement('div');x.className='toast';x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function login(){root.innerHTML=`<div class="login"><form class="login-card" id="loginForm"><div class="brand"><img class="brand-logo" src="/assets/enspy-logo.jpg" alt="Logo ENSPY"><div><h1>ENSPY Admin</h1><span>Centre de commandement académique</span></div></div><h2>Bienvenue</h2><p>Gérez les contenus, les niveaux, les utilisateurs et les notifications depuis un seul espace.</p><div class="field"><label>ADRESSE E-MAIL</label><input id="email" type="email" value="admin@enspy.cm" required></div><div class="field"><label>MOT DE PASSE</label><input id="password" type="password" required></div><button class="primary" style="width:100%;margin-top:8px">Ouvrir le centre d'administration</button><p class="small" style="margin-top:18px">Utilisez le compte administrateur principal configuré sur le serveur. Changez son mot de passe avant toute mise en production.</p></form></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});if(d.user.role==='student')throw new Error('Ce compte n\'est pas administrateur.');state.token=d.token;state.user=d.user;localStorage.setItem('enspy_admin_token',d.token);localStorage.setItem('enspy_admin_user',JSON.stringify(d.user));render()}catch(err){toast(err.message)}}}
const nav=[['dashboard','◈','Tableau de bord'],['academic','▦','Structure académique'],['content','▤','Contenus & publications'],['users','♙','Étudiants'],['admins','♟','Administrateurs'],['forum','◉','Forum étudiants'],['events','▣','Agenda'],['contributions','⇧','Soumissions'],['notifications','◌','Notifications'],['audit','⌁','Journal d’activité']];
function shell(){root.innerHTML=`<div class="app"><aside class="sidebar"><div class="side-brand"><img class="side-logo" src="/assets/enspy-logo.jpg" alt="ENSPY"><div><strong>ENSPY Admin</strong><span>Plateforme académique</span></div></div><nav class="nav">${nav.map(n=>`<button data-page="${n[0]}" class="${state.page===n[0]?'active':''}"><b>${n[1]}</b>${n[2]}</button>`).join('')}</nav><div class="side-bottom"><div class="user-mini"><div class="avatar">${(state.user?.name||'A')[0]}</div><div><strong>${state.user?.name||'Administrateur'}</strong><small>${state.user?.role||''}</small></div></div><button class="logout" id="logout">Se déconnecter</button></div></aside><main class="main"><div id="view"></div></main></div>`;document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});$('#logout').onclick=()=>{localStorage.clear();state.token='';state.user=null;login()};loadPage()}

function forumAttachment(a){
  const url=esc(a.fileUrl||'');
  const name=esc(a.originalName||'Pièce jointe');
  const mime=String(a.mimeType||'').toLowerCase();
  if(!url)return '';
  if(mime.startsWith('image/'))return `<div class="forum-attachment"><strong>${name}</strong><img class="forum-preview" src="${url}" alt="${name}" loading="lazy" onerror="this.style.display='none'"><a class="secondary" href="${url}" target="_blank" rel="noreferrer">Ouvrir l'image</a></div>`;
  if(mime.startsWith('video/'))return `<div class="forum-attachment"><strong>${name}</strong><video class="forum-preview" controls preload="metadata" src="${url}"></video><a class="secondary" href="${url}" target="_blank" rel="noreferrer">Ouvrir la vidéo</a></div>`;
  if(mime.startsWith('audio/'))return `<div class="forum-attachment"><strong>${name}</strong><audio controls style="width:100%;margin-top:8px" src="${url}"></audio><a class="secondary" href="${url}" target="_blank" rel="noreferrer">Ouvrir le fichier</a></div>`;
  return `<a class="forum-attachment" href="${url}" target="_blank" rel="noreferrer">↗ <strong>${name}</strong><br><span class="small">${esc(a.mimeType||'Document')} · ${Math.max(0,Math.round(Number(a.fileSize||0)/1024))} Ko</span></a>`;
}

async function selectForumPost(id){window._forumSelectedId=id;await forum()}
async function deleteForumPost(id){

}
async function deleteForumAnswer(answerId,postId){
  if(!confirm('Supprimer définitivement cette réponse ?'))return;
  try{await api('/forum/answers/'+answerId,{method:'DELETE'});window._forumSelectedId=postId;toast('Réponse supprimée.');await forum()}catch(e){toast(e.message)}
}
async function replyForum(postId){
  const box=$('#forumReply'),content=box?.value.trim();
  if(!content||content.length<5){toast('La réponse doit contenir au moins 5 caractères.');return}

}

  `<div class="contrib-stat"><div><b>${pending.length}</b><span>En attente</span></div><div><b>${approved.length}</b><span>Publiées</span></div><div><b>${rejected.length}</b><span>Refusées</span></div><div><b>${all.length}</b><span>Total</span></div></div>`+
  `<div class="panel"><div class="panel-body"><div class="contrib-toolbar"><button class="tab active" data-cfilter="all">Toutes · ${all.length}</button><button class="tab" data-cfilter="pending">En attente · ${pending.length}</button><button class="tab" data-cfilter="approved">Publiées · ${approved.length}</button><button class="tab" data-cfilter="rejected">Refusées · ${rejected.length}</button></div><div id="contribList" class="contrib-grid">${all.map(card).join('')||'<div class="contrib-empty" style="grid-column:1/-1">Aucune soumission pour le moment.</div>'}</div></div></div>`;

async function reviewContribution(id,status){

async function previewContribution(id){
  try{
    const items=await api('/contributions?status=pending').then(p=>p).catch(()=>[]);
    const [a,b]=await Promise.all([api('/contributions?status=approved'),api('/contributions?status=rejected')]);
    const x=[...items,...a,...b].find(v=>Number(v.id)===Number(id));
    if(!x)throw new Error('Soumission introuvable');
    const url=x.fileUrl||''; const ext=(url.split('.').pop()||'').toLowerCase().split('?')[0];
    const type=({jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',pdf:'application/pdf',mp4:'video/mp4',webm:'video/webm',mov:'video/quicktime',mp3:'audio/mpeg',wav:'audio/wav',m4a:'audio/mp4',txt:'text/plain',csv:'text/csv'})[ext]||'';
    let body=`<div class="preview-box"><div class="empty">Aperçu non disponible pour ce format.<br><a class="secondary" href="${esc(url)}" download>Télécharger le fichier</a></div></div>`;
    if(type.startsWith('image/'))body=`<div class="preview-box"><img src="${esc(url)}" alt="Aperçu du document"></div>`;
    else if(type==='application/pdf')body=`<div class="preview-box"><iframe src="${esc(url)}" title="Aperçu PDF"></iframe></div>`;
    else if(type.startsWith('video/'))body=`<div class="preview-box"><video controls src="${esc(url)}"></video></div>`;
    else if(type.startsWith('audio/'))body=`<div class="preview-box"><audio controls src="${esc(url)}"></audio></div>`;
    else if(type==='text/plain'||type==='text/csv'){const text=await fetch(url,{headers:{Authorization:'Bearer '+state.token}}).then(r=>r.text());body=`<div class="preview-box"><pre class="preview-text">${esc(text.slice(0,50000))}</pre></div>`;}
    modal(`Aperçu · ${esc(x.title)}`,`${body}<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:14px"><span class="small">${esc(x.contributorName||'Étudiant')} · ${esc(x.subjectName||'')}</span><a class="primary" href="${esc(url)}" download>Télécharger</a></div>`);
  }catch(e){toast(e.message)}
}

    const token=localStorage.getItem('enspy_admin_token');
    if(!token){return;} mount();
    try{const r=await fetch('/api/admin/activity',{headers:{Authorization:'Bearer '+token},cache:'no-store'});if(!r.ok)throw new Error();const data=await r.json();const fresh=new Set();const newItems=[];for(const x of (data.items||[])){const key=x.type+':'+x.id+':'+x.createdAt;if(lastKey&&key===lastKey)break;if(!boot)newItems.push(x);if(!boot&&lastKey!==key)fresh.add(key)}if(boot){lastKey=(data.items||[])[0]?((data.items[0].type+':'+data.items[0].id+':'+data.items[0].createdAt)):lastKey;localStorage.setItem('enspy_live_activity_key',lastKey);boot=false}else if(newItems.length){lastKey=(data.items||[])[0]?((data.items[0].type+':'+data.items[0].id+':'+data.items[0].createdAt)):lastKey;localStorage.setItem('enspy_live_activity_key',lastKey)}items=data.items||[];render(newItems.length?fresh:null);document.getElementById('liveActivityStatus').textContent='Connecté · '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});if(newItems.length&&navigator.vibrate)navigator.vibrate([80,40,80]);}
    catch(e){const s=document.getElementById('liveActivityStatus');if(s)s.textContent='Hors ligne';}
  }
  const start=()=>{mount();poll();setInterval(()=>{if(localStorage.getItem('enspy_admin_token'))poll()},5000)}; if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
})();
</script>
