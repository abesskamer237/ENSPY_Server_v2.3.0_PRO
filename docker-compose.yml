services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: enspy
      POSTGRES_USER: enspy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [enspy_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enspy -d enspy"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ./api/migrations:/migrations:ro
      - ./seed.sql:/seed.sql:ro
    networks: [enspy_network]
    command: >
      sh -c "
      echo '[db-init] 0000_initial.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0000_initial.sql &&
      echo '[db-init] seed.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /seed.sql &&
      echo '[db-init] 0001_academic_platform.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0001_academic_platform.sql &&
      echo '[db-init] 0002_enspy_curriculum_and_notification_media.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0002_enspy_curriculum_and_notification_media.sql &&
      echo '[db-init] 0003_notification_user_state_and_media_backfill.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0003_notification_user_state_and_media_backfill.sql &&
      echo '[db-init] 0004_forum_community.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0004_forum_community.sql &&
      echo '[db-init] 0005_v23_pro.sql';
      psql -h postgres -U enspy -d enspy -v ON_ERROR_STOP=1 -f /migrations/0005_v23_pro.sql &&
      echo '[db-init] OK'
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://enspy:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/enspy
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-180}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-15}
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - uploads_data:/app/uploads
    networks: [enspy_network]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    networks: [enspy_network]

  certbot:
    image: certbot/certbot:v5.7.0
    profiles: ["certbot"]
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks: [enspy_network]

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    networks: [enspy_network]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  enspy_network:
    name: enspy_network
    external: true

volumes:
  postgres_data:
  uploads_data:
  redis_data:
